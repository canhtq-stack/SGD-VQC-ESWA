name: sgd-vqc
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10.14
  - pip=24.0

  # ── Core scientific stack ──────────────────────────────────────────────────
  - numpy=1.26.4
  - pandas=2.2.2
  - scipy=1.13.1
  - matplotlib=3.8.4
  - seaborn=0.13.2

  # ── Machine learning ───────────────────────────────────────────────────────
  - scikit-learn=1.5.1

  # ── Excel export ───────────────────────────────────────────────────────────
  - openpyxl=3.1.5

  # ── pip-only packages ──────────────────────────────────────────────────────
  - pip:
    # Quantum computing (Qiskit v1.x)
    - qiskit==1.2.4
    - qiskit-machine-learning==0.8.2
    - qiskit-aer==0.15.1

    # Imbalanced learning (SMOTE)
    - imbalanced-learn==0.12.3

    # Gradient boosting
    - xgboost==2.1.1

    # Statistical testing
    - statsmodels==0.14.3

# ── Reproducibility note ───────────────────────────────────────────────────
# All random seeds are fixed: seed=42 throughout the pipeline.
# To create and activate this environment:
#   conda env create -f environment.yml
#   conda activate sgd-vqc
